<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Think</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">
    <div class="min-h-screen flex flex-col sm:justify-center items-center pt-8 sm:pt-0 bg-slate-50 px-4">
        <div>
            <a href="/" class="flex items-center gap-2.5 text-2xl font-bold tracking-tight text-slate-800">
                <span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-rose-600 flex items-center justify-center text-white shadow-lg shadow-rose-500/30">T</span>
                Think
            </a>
        </div>

        <div class="w-full sm:max-w-md mt-6 px-8 py-8 bg-white shadow-xl shadow-slate-200/50 overflow-hidden sm:rounded-2xl border border-slate-100">
            {{ template "content" . }}
        </div>

        <div class="mt-8 text-center text-xs text-slate-400">
            &copy; 2026 Think. The Go Web Framework for Artisans.
        </div>
    </div>
</body>
</html>
