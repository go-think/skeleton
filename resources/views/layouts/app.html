<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Think Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-900 min-h-screen flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm" x-data="{ open: false }">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-8">
                    <a href="/dashboard" class="flex items-center gap-2 text-xl font-bold tracking-tight text-slate-800">
                        <span class="w-8 h-8 rounded-lg bg-gradient-to-tr from-rose-500 to-rose-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-rose-500/30">T</span>
                        Think
                    </a>
                    <div class="hidden sm:flex sm:space-x-6">
                        <a href="/dashboard" class="inline-flex items-center px-1 pt-1 border-b-2 border-rose-500 text-sm font-semibold text-slate-900">
                            Dashboard
                        </a>
                        <a href="/status" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300">
                            System Status
                        </a>
                    </div>
                </div>

                <div class="hidden sm:flex sm:items-center sm:gap-4">
                    <div class="text-sm font-medium text-slate-700">
                        {{ auth_user }}
                    </div>
                    <form method="POST" action="/logout" class="inline">
                        {{ csrf_field }}
                        <button type="submit" class="px-3.5 py-1.5 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg transition-colors">
                            Log Out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{ template "content" . }}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Think Framework &bull; Authenticated Session Active
    </footer>
</body>
</html>
